name: mirabilis

services:
  mirabilis:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        TZ: ${TZ:-Etc/UTC}
        MIRABILIS_VERSION: ${MIRABILIS_VERSION:-unknown}
    image: mirabilis:local
    container_name: mirabilis
    hostname: mirabilis
    security_opt:
      - seccomp=unconfined
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GITHUB_TOKEN:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      TZ: ${TZ:-Etc/UTC}
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-${HOME}/mirabilis-workspace}
        target: /workspace
      - claude-home:/home/node/.claude
      - gh-config:/home/node/.config/gh
    tmpfs:
      - /tmp
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  claude-home:
  gh-config:
