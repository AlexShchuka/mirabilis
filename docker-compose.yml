name: mirabilis

services:
  mirabilis:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.89}
        INSTALL_NODE: ${INSTALL_NODE:-false}
    image: mirabilis:local
    container_name: mirabilis
    hostname: mirabilis
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GITHUB_TOKEN:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      ALLOWLIST_EXTRA: ${ALLOWLIST_EXTRA:-}
      TZ: ${TZ:-Etc/UTC}
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-${HOME}/mirabilis-workspace}
        target: /workspace
      - claude-home:/home/coder/.claude
      - gh-config:/home/coder/.config/gh
    tmpfs:
      - /tmp
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  claude-home:
  gh-config:
