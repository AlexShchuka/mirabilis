name: mirabilis

services:
  mirabilis:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        TZ: ${TZ:-Etc/UTC}
        MIRABILIS_VERSION: ${MIRABILIS_VERSION:-unknown}
        STACKS: ${STACKS:-}
    image: mirabilis:local
    container_name: mirabilis
    hostname: mirabilis
    cap_drop:
      - ALL
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - SETFCAP
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    mem_limit: 8g
    cpus: "4.0"
    pids_limit: 4096
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Etc/UTC}
      XDG_DATA_HOME: /home/node/.claude/xdg-data
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - workspace:/workspace
      - ./.mirabilis:/workspace/.mirabilis
      - claude-home:/home/node/.claude
      - gh-config:/home/node/.config/gh
    tmpfs:
      - /tmp
    entrypoint: ["/usr/bin/tini", "--", "sleep", "infinity"]
    command: []
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  workspace:
  claude-home:
  gh-config:
