name: mirabilis

services:
  mirabilis:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        TZ: ${TZ:-Etc/UTC}
        MIRABILIS_VERSION: ${MIRABILIS_VERSION:-unknown}
    image: mirabilis:local
    container_name: mirabilis
    hostname: mirabilis
    security_opt:
      - seccomp=unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GITHUB_TOKEN:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      TZ: ${TZ:-Etc/UTC}
      DISABLE_AUTOUPDATER: "1"
      XDG_DATA_HOME: /home/node/.claude/xdg-data
      HTTP_PROXY: http://host.docker.internal:${MIRABILIS_PROXY_PORT:-38128}
      HTTPS_PROXY: http://host.docker.internal:${MIRABILIS_PROXY_PORT:-38128}
      http_proxy: http://host.docker.internal:${MIRABILIS_PROXY_PORT:-38128}
      https_proxy: http://host.docker.internal:${MIRABILIS_PROXY_PORT:-38128}
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-${HOME}/mirabilis-workspace}
        target: /workspace
      - claude-home:/home/node/.claude
      - gh-config:/home/node/.config/gh
    tmpfs:
      - /tmp
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  claude-home:
  gh-config:
