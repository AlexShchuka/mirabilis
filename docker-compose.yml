name: mirabilis

services:
  mirabilis:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        TZ: ${TZ:-Etc/UTC}
        MIRABILIS_VERSION: ${MIRABILIS_VERSION:-unknown}
        STACKS: ${STACKS:-}
    image: mirabilis:local
    container_name: mirabilis
    hostname: mirabilis
    security_opt:
      - seccomp=unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TZ: ${TZ:-Etc/UTC}
      XDG_DATA_HOME: /home/node/.claude/xdg-data
    volumes:
      - workspace:/workspace
      - claude-home:/home/node/.claude
      - gh-config:/home/node/.config/gh
    tmpfs:
      - /tmp
    entrypoint: ["/usr/bin/tini", "--", "/opt/mirabilis/entrypoint.sh"]
    command: []
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  workspace:
  claude-home:
  gh-config:
