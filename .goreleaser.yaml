version: 2

project_name: mirabilis-menu

builds:
  - id: mirabilis-menu
    dir: src/menu
    main: .
    binary: mirabilis-menu
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64

archives:
  - id: mirabilis-menu
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: mirabilis-menu
    repository:
      owner: AlexShchuka
      name: homebrew-mirabilis
    homepage: https://github.com/AlexShchuka/mirabilis
    description: TUI menu binary for the mirabilis Claude Code sandbox
