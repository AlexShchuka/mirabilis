name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: shell lint (shellcheck · shfmt · checkbashisms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck · shfmt · checkbashisms
        uses: luizm/action-sh-checker@v0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHELLCHECK_OPTS: -x -e SC1091
          SHFMT_OPTS: -i 2 -ci
        with:
          sh_checker_checkbashisms_enable: true
          sh_checker_exclude: src/test src/menu

  hadolint:
    name: dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/Dockerfile
          config: .hadolint.yaml

  bats:
    name: bats behaviour tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install jq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq
      - name: setup bats + helper libs
        uses: bats-core/bats-action@4.0.0
        with:
          bats-version: latest
          support-path: /usr/lib/bats-support
          assert-path: /usr/lib/bats-assert
          file-path: /usr/lib/bats-file
      - name: run bats
        env:
          BATS_LIB_PATH: /usr/lib
        run: bats --print-output-on-failure --recursive src/test

  go:
    name: go build · vet · test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: guard — skip if the go menu is not present yet
        id: guard
        run: |
          if [ -f src/menu/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "src/menu/go.mod not found — skipping go job"
          fi
      - uses: actions/setup-go@v6
        if: steps.guard.outputs.present == 'true'
        with:
          go-version-file: src/menu/go.mod
          cache-dependency-path: src/menu/go.mod
      - name: deps (generate go.sum)
        if: steps.guard.outputs.present == 'true'
        working-directory: src/menu
        run: go mod download
      - name: build
        if: steps.guard.outputs.present == 'true'
        working-directory: src/menu
        run: go build ./...
      - name: vet
        if: steps.guard.outputs.present == 'true'
        working-directory: src/menu
        run: go vet ./...
      - name: test -race
        if: steps.guard.outputs.present == 'true'
        working-directory: src/menu
        run: go test -race ./...
