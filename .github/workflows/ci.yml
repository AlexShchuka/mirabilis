name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go build · vet · test -race
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint
          actionlint
      - name: test -race
        run: go test -race -covermode=atomic -coverprofile=cover.out -tags integration ./...
      - id: cover
        name: coverage summary
        run: |
          grep -v 'cmd/mirabilis' cover.out > cover_filtered.out
          pct=$(go tool cover -func=cover_filtered.out | tail -1 | awk '{print $3}')
          echo "**Coverage:** $pct" >> "$GITHUB_STEP_SUMMARY"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          floor=87
          if awk -v pct="$(echo "$pct" | tr -d '%')" -v floor="$floor" 'BEGIN{exit !(pct < floor)}'; then echo "coverage $pct below floor ${floor}%"; exit 1; fi
      - if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: coverage
          message: "Coverage: ${{ steps.cover.outputs.pct }}"

  go-macos:
    name: go vet · test -race (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: vet
        run: go vet -tags integration ./...
      - name: test -race
        run: go test -race -tags integration ./...

  bats:
    name: install.sh smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: setup bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run bats
        run: bats --print-output-on-failure --recursive test

  windows-wsl:
    name: install.sh smoke (wsl2)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          wsl-version: 2
          distribution: Ubuntu-24.04
          set-as-default: 'true'
      - name: install bats
        shell: wsl-bash {0}
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: run bats
        shell: wsl-bash {0}
        run: bats --print-output-on-failure --recursive test

  no-config-comments:
    name: no comments in non-code config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: check
        run: |
          files=$(git ls-files | grep -vE '\.(md|go)$' | grep -vE '^go\.(mod|sum)$' | grep -vE '^\.github/workflows/')
          if [ -z "$files" ]; then exit 0; fi
          hits=$(echo "$files" | xargs grep -HnE '(^|[[:space:]])(//|#)[[:space:]]' 2>/dev/null || true)
          if [ -n "$hits" ]; then printf '%s\n' "$hits"; exit 1; fi

  image-build:
    name: docker image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: build
        run: |
          MIRABILIS_VERSION=$(git rev-parse --short HEAD)
          export MIRABILIS_VERSION STACKS=
          docker compose -f docker-compose.yml build

  go-arch-lint:
    name: go-arch-lint component graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: check
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.15.0
          go-arch-lint check

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
