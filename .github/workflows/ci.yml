name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go build · vet · test -race
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "files above are not gofmt-clean"; exit 1; }
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test -race
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...
      - id: cover
        name: coverage summary
        run: |
          pct=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}')
          echo "**Coverage:** $pct" >> "$GITHUB_STEP_SUMMARY"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          message: "Coverage: ${{ steps.cover.outputs.pct }}"

  bats:
    name: install.sh smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: setup bats
        uses: bats-core/bats-action@4.0.0
        with:
          bats-version: latest
      - name: run bats
        run: bats --print-output-on-failure --recursive test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
