name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go build · vet · test -race
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "files above are not gofmt-clean"; exit 1; }
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test -race
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...
      - id: cover
        name: coverage summary
        run: |
          grep -v 'cmd/mirabilis' cover.out > cover_filtered.out
          pct=$(go tool cover -func=cover_filtered.out | tail -1 | awk '{print $3}')
          echo "**Coverage:** $pct" >> "$GITHUB_STEP_SUMMARY"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          floor=71
          num=$(echo "$pct" | tr -d '%' | awk '{printf "%d", $1}')
          if [ "$num" -lt "$floor" ]; then echo "coverage $pct below floor ${floor}%"; exit 1; fi
      - if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: coverage
          message: "Coverage: ${{ steps.cover.outputs.pct }}"

  bats:
    name: install.sh smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: setup bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: latest
      - name: run bats
        run: bats --print-output-on-failure --recursive test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
