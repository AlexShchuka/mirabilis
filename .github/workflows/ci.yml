name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go build · vet · test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "files above are not gofmt-clean"; exit 1; }
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test -race
        run: go test -race ./...

  bats:
    name: install.sh smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: setup bats
        uses: bats-core/bats-action@4.0.0
        with:
          bats-version: latest
      - name: run bats
        run: bats --print-output-on-failure --recursive test
