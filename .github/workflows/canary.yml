name: canary

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: rebuild container image (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: cross-compile the container binary
        run: make linux
      - name: docker build (default stacks)
        run: docker build -f .devcontainer/Dockerfile -t mirabilis:canary .
      - name: nag if newer Go is available
        run: |
          pinned="$(grep 'ARG GO_VERSION=' .devcontainer/Dockerfile | head -1 | cut -d= -f2)"
          latest="$(curl -fsSL https://go.dev/VERSION?m=text | head -1)"
          if [ "$pinned" != "$latest" ]; then
            echo "[canary] newer Go available: pinned=$pinned latest=$latest — update ARG GO_VERSION in .devcontainer/Dockerfile"
          else
            echo "[canary] Go is up to date: $pinned"
          fi

  tests:
    name: re-run go + install.sh smoke (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go
        run: go build ./... && go vet ./... && go test -race ./...
      - name: setup bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: latest
      - name: bats
        run: bats --print-output-on-failure --recursive test
