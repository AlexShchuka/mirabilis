name: canary

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: rebuild container image (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: cross-compile the container binary
        run: make linux
      - name: docker build (default stacks)
        run: docker build -f .devcontainer/Dockerfile -t mirabilis:canary .
      - name: nag if newer Go is available
        run: |
          pinned="$(grep 'ARG GO_VERSION=' .devcontainer/Dockerfile | head -1 | cut -d= -f2)"
          latest="$(curl -fsSL https://go.dev/VERSION?m=text | head -1)"
          if [ "$pinned" != "$latest" ]; then
            echo "[canary] newer Go available: pinned=$pinned latest=$latest — update ARG GO_VERSION in .devcontainer/Dockerfile"
          else
            echo "[canary] Go is up to date: $pinned"
          fi

  devcontainer:
    name: devcontainer up + configured assertions (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: cross-compile the container binary
        run: make linux
      - name: install devcontainer CLI
        run: npm install -g @devcontainers/cli
      - name: devcontainer up
        run: devcontainer up --workspace-folder .
      - name: assert settings seeded (no in-container sandbox)
        run: devcontainer exec --workspace-folder . bash -lc 'test -f "$HOME/.claude/settings.json" && jq -e ".sandbox == null" "$HOME/.claude/settings.json"'
      - name: assert harness-presence canary (CLAUDE.md symlink + CLAUDE_PLUGIN_ROOT in .bashrc)
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            test -L "$HOME/.neuro-matrix/CLAUDE.md" || { echo "[canary] CLAUDE.md symlink missing — harness not installed"; exit 1; }
            grep -q "CLAUDE_PLUGIN_ROOT" "$HOME/.bashrc" || { echo "[canary] CLAUDE_PLUGIN_ROOT missing from .bashrc — harness not installed"; exit 1; }
          ' || echo "[canary] harness presence check skipped — neuro-matrix not installed in this CI run"

  tests:
    name: re-run go + install.sh smoke (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go
        run: go build ./... && go vet ./... && go test -race ./...
      - name: setup bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: latest
      - name: bats
        run: bats --print-output-on-failure --recursive test
