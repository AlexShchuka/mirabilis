name: canary

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: rebuild container image (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: cross-compile the container binary
        run: make linux
      - name: docker build (default stacks)
        run: docker build -f .devcontainer/Dockerfile -t mirabilis:canary .

  devcontainer:
    name: devcontainer up + configured assertions (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: cross-compile the container binary
        run: make linux
      - name: install devcontainer CLI
        run: npm install -g @devcontainers/cli
      - name: devcontainer up
        run: devcontainer up --workspace-folder .
      - name: assert settings seeded (no in-container sandbox)
        run: devcontainer exec --workspace-folder . bash -lc 'test -f "$HOME/.claude/settings.json" && jq -e ".sandbox == null" "$HOME/.claude/settings.json"'

  tests:
    name: re-run go + install.sh smoke (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go
        run: go build ./... && go vet ./... && go test -race ./...
      - name: setup bats
        uses: bats-core/bats-action@4.0.0
        with:
          bats-version: latest
      - name: bats
        run: bats --print-output-on-failure --recursive test
